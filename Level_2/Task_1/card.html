
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cognifyz - Bulma Responsive Card</title>

    <!-- Bulma CSS Framework -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body class="has-background-light">

    <section class="section">
        <div class="container">

            <h1 class="title has-text-centered">
                My Web Development Projects
            </h1>

            <p class="subtitle has-text-centered">
                Cognifyz Technologies Internship
            </p>

            <div class="columns is-centered">
                <div class="column is-5">

                    <div class="card">

                        <div class="card-image">
                            <figure class="image is-16by9">
                                <img
                                    src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800"
                                    alt="Web development workspace">
                            </figure>
                        </div>

                        <div class="card-content">

                            <p class="title is-4">
                                Frontend Development
                            </p>

                            <p class="content">
                                I am learning HTML, CSS, JavaScript
                                and responsive web design through
                                practical projects.
                            </p>

                            <div class="tags">
                                <span class="tag is-info">HTML</span>
                                <span class="tag is-success">CSS</span>
                                <span class="tag is-warning">JavaScript</span>
                            </div>

                            <a href="grid.html" class="button is-link">
                                Explore Projects
                            </a>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </section>

</body>
</html>
